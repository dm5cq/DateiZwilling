# Baut DateiZwilling automatisch auf GitHub (Windows-EXE + macOS-DMG),
# fuehrt die Tests aus und legt das Release mit allen Dateien an bzw. aktualisiert es.
# Ausloeser: jeder Push auf main oder manuell (Actions -> Build & Release -> Run workflow).
# Die Versionsnummer kommt aus dateizwilling/__init__.py (APP_VERSION) -> Tag vX.Y.Z.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze > build-lock.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name DateiZwilling
          --icon assets\icon.ico --add-data "assets;assets"
          --collect-all tkinterdnd2 --collect-all pypdfium2
          --version-file version_info.txt DateiZwilling.py
      - name: Pruefsumme
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DateiZwilling.exe -Algorithm SHA256).Hash
          "$h  DateiZwilling.exe" | Out-File -Encoding ascii dist\DateiZwilling.exe.sha256.txt
          Get-Content dist\DateiZwilling.exe.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DateiZwilling.exe
            dist/DateiZwilling.exe.sha256.txt
            build-lock.txt

  macos:
    name: macOS-App
    runs-on: macos-latest
    continue-on-error: true   # Mac-Build darf das Windows-Release nicht blockieren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests
        continue-on-error: true
        run: python -m unittest discover -s tests
      - name: App bauen
        run: |
          pyinstaller --noconfirm --clean --windowed --name DateiZwilling \
            --icon assets/icon.icns --add-data "assets:assets" \
            --collect-all tkinterdnd2 --collect-all pypdfium2 \
            --osx-bundle-identifier de.kaiser-burghausen.dateizwilling DateiZwilling.py
          codesign --force --deep --sign - dist/DateiZwilling.app || true
          hdiutil create -volname DateiZwilling -srcfolder dist/DateiZwilling.app -ov -format UDZO dist/DateiZwilling-macOS.dmg
          shasum -a 256 dist/DateiZwilling-macOS.dmg > dist/DateiZwilling-macOS.dmg.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/DateiZwilling-macOS.dmg
            dist/DateiZwilling-macOS.dmg.sha256.txt

  release:
    name: Release veroeffentlichen
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefakte
      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('dateizwilling/__init__.py').read()).group(1))")
          TAG="v$VER"
          echo "Version: $VER"
          FILES="artefakte/windows/dist/DateiZwilling.exe artefakte/windows/dist/DateiZwilling.exe.sha256.txt Dokumentation/QuickGuide_DE.pdf Dokumentation/QuickGuide_EN.pdf Dokumentation/Technische_Beschreibung_DE.pdf Dokumentation/Technical_Description_EN.pdf"
          if [ -f artefakte/macos/DateiZwilling-macOS.dmg ]; then
            FILES="$FILES artefakte/macos/DateiZwilling-macOS.dmg artefakte/macos/DateiZwilling-macOS.dmg.sha256.txt"
          elif [ -f artefakte/macos/dist/DateiZwilling-macOS.dmg ]; then
            FILES="$FILES artefakte/macos/dist/DateiZwilling-macOS.dmg artefakte/macos/dist/DateiZwilling-macOS.dmg.sha256.txt"
          fi
          find artefakte -type f
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DateiZwilling $VER" --notes-file docs/RELEASE-NOTES.md --latest
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "DateiZwilling $VER" \
              --notes-file docs/RELEASE-NOTES.md --latest
          fi
